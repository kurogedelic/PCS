<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCS-100</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --grid: 17.78mm; }
    * { box-sizing: border-box; }
    .panel { font-family: "Jost", sans-serif; }
    html, body { margin: 0; min-width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #000;
    }
    .panel {
      width: 243.84mm; /* 48HP × 5.08mm */
      height: 128.5mm;
      flex: none;
      box-shadow: inset 0 0 0 2px #454545;
      position: relative;
      background-color: #000;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.16) 1px, transparent 1px);
      background-size: var(--grid) var(--grid);
      /* Keep the grid intersections aligned with the first module's jacks. */
      background-position: 22.86mm 19.8mm;
    }
    .module-block {
      position: absolute;
      border: 0.5mm solid #fff;
      border-radius: 2mm;
      pointer-events: none;
    }
    .module-block span {
      position: absolute;
      top: 1.5mm;
      left: 3mm;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #fff;
    }
    .jack {
      position: absolute;
      left: calc(22.86mm + var(--col) * 17.78mm);
      top: calc(19.8mm + var(--row) * 17.78mm);
      width: 8mm;
      height: 8mm;
      transform: translate(-50%, -50%);
      border: 1.2mm solid #9a9a9a;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 0 0.35mm #333, inset 0 0 0 0.7mm #333;
    }
    /* Large MXR-style knob: centered between grid intersections (2 × 2 cells). */
    .knob-large {
      position: absolute;
      width: 25mm;
      height: 25mm;
      transform: translate(-50%, -50%);
      border: 2mm solid #383838;
      border-radius: 50%;
      background: #101010;
    }
    .knob-large::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 2mm;
      width: 1.2mm;
      height: 9mm;
      transform: translateX(-50%);
      background: #fff;
      border-radius: 0.3mm;
    }
    .knob-small, .toggle {
      position: absolute;
      transform: translate(-50%, -50%);
    }
    .knob-small {
      width: 9mm;
      height: 9mm;
      border-radius: 50%;
      background: #171717;
      border: 0.8mm solid #777;
    }
    .knob-small::after {
      content: "";
      position: absolute;
      top: 0.7mm;
      left: 50%;
      transform: translateX(-50%);
      width: 0.7mm;
      height: 2.8mm;
      background: white;
    }
    .toggle {
      width: 7mm;
      height: 7mm;
      border: 0.6mm solid #999;
      border-radius: 50%;
      background: #222;
    }
    .toggle::after {
      content: "";
      position: absolute;
      width: 1.4mm;
      height: 6mm;
      left: 50%;
      top: -2mm;
      transform: translateX(-50%);
      border-radius: 0.6mm;
      background: #ddd;
    }
    .part-label {
      position: absolute;
      transform: translateX(-50%);
      font: 500 7px "Jost", sans-serif;
      color: #ccc;
      letter-spacing: 0.04em;
      white-space: nowrap;
      pointer-events: none;
    }
    .mounting-slot {
      position: absolute;
      width: 6mm;
      height: 3.2mm;
      border: 0.35mm solid #aaa;
      border-radius: 1.6mm;
      background: #000;
      transform: translate(-50%, -50%);
    }
    .mounting-slot.left { left: 7.5mm; }
    .mounting-slot.right { left: calc(100% - 7.5mm); }
    .mounting-slot.top { top: 3mm; }
    .mounting-slot.bottom { top: calc(100% - 3mm); }
  </style>
</head>
<body>
  <main class="panel" aria-label="PCS-100 48HP × 128.5mm panel">
    <!-- Each full-height module contains its own upper jacks and lower controls. -->
    <div class="module-block" style="left:13.97mm;top:10.91mm;width:35.56mm;height:106.68mm"><span>VCC</span></div>
    <div class="module-block" style="left:49.53mm;top:10.91mm;width:35.56mm;height:106.68mm"><span>PO</span></div>
    <div class="module-block" style="left:85.09mm;top:10.91mm;width:53.34mm;height:106.68mm"><span>VCW</span></div>
    <div class="module-block" style="left:138.43mm;top:10.91mm;width:17.78mm;height:106.68mm"><span>WF</span></div>
    <div class="module-block" style="left:156.21mm;top:10.91mm;width:17.78mm;height:106.68mm"><span>VCA</span></div>
    <div class="module-block" style="left:173.99mm;top:10.91mm;width:35.56mm;height:106.68mm"><span>EG</span></div>
    <div class="module-block" style="left:209.55mm;top:10.91mm;width:17.78mm;height:106.68mm"><span>UTIL</span></div>
    <div class="jack" style="--col:0;--row:0" aria-label="1V/OCT"></div>
    <div class="part-label" style="left:22.86mm;top:25mm">1V/OCT</div>
    <div class="jack" style="--col:1;--row:0" aria-label="CLK IN"></div>
    <div class="part-label" style="left:40.64mm;top:25mm">CLK IN</div>
    <div class="jack" style="--col:0;--row:1" aria-label="CLK OUT"></div>
    <div class="part-label" style="left:22.86mm;top:42.78mm">CLK OUT</div>
    <div class="jack" style="--col:1;--row:1" aria-label="PHASE OUT"></div>
    <div class="part-label" style="left:40.64mm;top:42.78mm">PHASE OUT</div>
    <div class="jack" style="--col:2;--row:0" aria-label="PHASE IN"></div>
    <div class="part-label" style="left:58.42mm;top:25mm">PHASE IN</div>
    <div class="jack" style="--col:3;--row:0" aria-label="PO CV"></div>
    <div class="part-label" style="left:76.2mm;top:25mm">PO CV</div>
    <div class="jack" style="--col:2;--row:1" aria-label="PO OUT"></div>
    <div class="part-label" style="left:58.42mm;top:42.78mm">PO OUT</div>
    <div class="jack" style="--col:3;--row:1" aria-label="PO IN"></div>
    <div class="part-label" style="left:76.2mm;top:42.78mm">PO IN</div>
    <div class="jack" style="--col:4;--row:0" aria-label="WINDOW CV"></div>
    <div class="part-label" style="left:93.98mm;top:25mm">WINDOW CV</div>
    <div class="jack" style="--col:5;--row:0" aria-label="RES CV"></div>
    <div class="part-label" style="left:111.76mm;top:25mm">RES CV</div>
    <div class="jack" style="--col:6;--row:0" aria-label="VCW OUT"></div>
    <div class="part-label" style="left:129.54mm;top:25mm">VCW OUT</div>
    <div class="jack" style="--col:4;--row:1" aria-label="RAMP IN"></div>
    <div class="part-label" style="left:93.98mm;top:42.78mm">RAMP IN</div>
    <div class="jack" style="--col:7;--row:0" aria-label="WF IN"></div>
    <div class="part-label" style="left:147.32mm;top:25mm">WF IN</div>
    <div class="jack" style="--col:7;--row:1" aria-label="WF OUT"></div>
    <div class="part-label" style="left:147.32mm;top:42.78mm">WF OUT</div>
    <div class="jack" style="--col:8;--row:0" aria-label="VCA IN"></div>
    <div class="part-label" style="left:165.1mm;top:25mm">VCA IN</div>
    <div class="jack" style="--col:8;--row:1" aria-label="VCA OUT"></div>
    <div class="part-label" style="left:165.1mm;top:42.78mm">VCA OUT</div>
    <div class="jack" style="--col:9;--row:0" aria-label="GATE"></div>
    <div class="part-label" style="left:182.88mm;top:25mm">GATE</div>
    <div class="jack" style="--col:10;--row:0" aria-label="EG OUT"></div>
    <div class="part-label" style="left:200.66mm;top:25mm">EG OUT</div>
    <div class="jack" style="--col:9;--row:1" aria-label="LFO OUT"></div>
    <div class="part-label" style="left:182.88mm;top:42.78mm">LFO OUT</div>
    <div class="jack" style="--col:10;--row:1" aria-label="VCA CV"></div>
    <div class="part-label" style="left:200.66mm;top:42.78mm">VCA CV</div>
    <div class="jack" style="--col:11;--row:0" aria-label="ATT IN"></div>
    <div class="part-label" style="left:218.44mm;top:25mm">ATT IN</div>
    <div class="jack" style="--col:11;--row:1" aria-label="ATT OUT"></div>
    <div class="part-label" style="left:218.44mm;top:42.78mm">ATT OUT</div>
    <div class="knob-small" style="left:22.86mm;top:73.14mm" aria-label="FREQ"></div>
    <div class="part-label" style="left:22.86mm;top:78.64mm">FREQ</div>
    <div class="toggle" style="left:40.64mm;top:90.92mm" aria-label="SYNC"></div>
    <div class="part-label" style="left:40.64mm;top:96.42mm">SYNC</div>
    <div class="knob-small" style="left:58.42mm;top:73.14mm" aria-label="AMOUNT"></div>
    <div class="part-label" style="left:58.42mm;top:78.64mm">AMOUNT</div>
    <div class="toggle" style="left:76.2mm;top:90.92mm" aria-label="MODE"></div>
    <div class="part-label" style="left:76.2mm;top:96.42mm">MODE</div>
    <div class="knob-large" style="left:111.76mm;top:90.92mm" aria-label="VCW large knob"></div>
    <div class="knob-small" style="left:93.98mm;top:73.14mm" aria-label="SHAPE"></div>
    <div class="part-label" style="left:93.98mm;top:78.64mm">SHAPE</div>
    <div class="knob-small" style="left:129.54mm;top:73.14mm" aria-label="WINDOW"></div>
    <div class="part-label" style="left:129.54mm;top:78.64mm">WINDOW</div>
    <div class="toggle" style="left:93.98mm;top:108.7mm" aria-label="MODE"></div>
    <div class="part-label" style="left:93.98mm;top:114.2mm">MODE</div>
    <div class="knob-small" style="left:147.32mm;top:90.92mm" aria-label="FOLD"></div>
    <div class="part-label" style="left:147.32mm;top:96.42mm">FOLD</div>
    <div class="knob-small" style="left:165.1mm;top:90.92mm" aria-label="LEVEL"></div>
    <div class="part-label" style="left:165.1mm;top:96.42mm">LEVEL</div>
    <div class="knob-small" style="left:182.88mm;top:73.14mm" aria-label="A"></div>
    <div class="part-label" style="left:182.88mm;top:78.64mm">A</div>
    <div class="knob-small" style="left:200.66mm;top:73.14mm" aria-label="D"></div>
    <div class="part-label" style="left:200.66mm;top:78.64mm">D</div>
    <div class="knob-small" style="left:182.88mm;top:108.7mm" aria-label="S"></div>
    <div class="part-label" style="left:182.88mm;top:114.2mm">S</div>
    <div class="knob-small" style="left:200.66mm;top:108.7mm" aria-label="R"></div>
    <div class="part-label" style="left:200.66mm;top:114.2mm">R</div>
    <div class="knob-small" style="left:218.44mm;top:73.14mm" aria-label="LFO"></div>
    <div class="part-label" style="left:218.44mm;top:78.64mm">LFO</div>
    <div class="knob-small" style="left:218.44mm;top:108.7mm" aria-label="ATT"></div>
    <div class="part-label" style="left:218.44mm;top:114.2mm">ATT</div>
    <div class="mounting-slot left top" aria-label="Top-left mounting slot"></div>
    <div class="mounting-slot right top" aria-label="Top-right mounting slot"></div>
    <div class="mounting-slot left bottom" aria-label="Bottom-left mounting slot"></div>
    <div class="mounting-slot right bottom" aria-label="Bottom-right mounting slot"></div>
  </main>
</body>
</html>
