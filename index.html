<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCS-100</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --grid: 17.78mm; }
    * { box-sizing: border-box; }
    .panel { font-family: "Jost", sans-serif; }
    html, body { margin: 0; min-width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #000;
    }
    .panel {
      width: 243.84mm; /* 48HP × 5.08mm */
      height: 128.5mm;
      flex: none;
      box-shadow: inset 0 0 0 2px #454545;
      position: relative;
      background-color: #000;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.16) 1px, transparent 1px);
      background-size: var(--grid) var(--grid);
      /* Keep the grid intersections aligned with the first module's jacks. */
      background-position: 22.86mm 19.8mm;
    }
    .module-block { position:absolute; pointer-events:none; border-left: .25mm solid #505050; top:12mm; height:105mm; }
    .module-block span { position:absolute; top:-1mm; left:2mm; font-size:11px; font-weight:600; letter-spacing:.14em; color:#fff; }
    .diagram { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .diagram .flow { fill:none; stroke:#e0e0e0; stroke-width:.48; stroke-linejoin:round; }
    .diagram .mod { fill:none; stroke:#888; stroke-width:.32; stroke-dasharray:1.5 1.2; }
    .diagram .node { fill:#000; stroke:#eee; stroke-width:.45; }
    .diagram text { font-family:"Jost",sans-serif; font-size:2.8px; fill:#ccc; letter-spacing:.3px; }
    .diagram .symbol { stroke:#aaa; stroke-width:.38; fill:none; }
    .jack {
      position: absolute;
      width: 8mm;
      height: 8mm;
      transform: translate(-50%, -50%);
      border: 1.2mm solid #9a9a9a;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 0 0.35mm #333, inset 0 0 0 0.7mm #333;
    }
    /* Large MXR-style knob: centered between grid intersections (2 × 2 cells). */
    .knob-large {
      position: absolute;
      width: 25mm;
      height: 25mm;
      transform: translate(-50%, -50%);
      border: 2mm solid #383838;
      border-radius: 50%;
      background: #101010;
    }
    .knob-large::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 2mm;
      width: 1.2mm;
      height: 9mm;
      transform: translateX(-50%);
      background: #fff;
      border-radius: 0.3mm;
    }
    .knob-small, .toggle {
      position: absolute;
      transform: translate(-50%, -50%);
    }
    .knob-small {
      width: 9mm;
      height: 9mm;
      border-radius: 50%;
      background: #171717;
      border: 0.8mm solid #777;
    }
    .knob-small::after {
      content: "";
      position: absolute;
      top: 0.7mm;
      left: 50%;
      transform: translateX(-50%);
      width: 0.7mm;
      height: 2.8mm;
      background: white;
    }
    .toggle {
      width: 7mm;
      height: 7mm;
      border: 0.6mm solid #999;
      border-radius: 50%;
      background: #222;
    }
    .toggle::after {
      content: "";
      position: absolute;
      width: 1.4mm;
      height: 6mm;
      left: 50%;
      top: -2mm;
      transform: translateX(-50%);
      border-radius: 0.6mm;
      background: #ddd;
    }
    .part-label {
      position: absolute;
      transform: translateX(-50%);
      font: 500 8px "Jost", sans-serif;
      color: #ccc;
      letter-spacing: 0.04em;
      white-space: nowrap;
      pointer-events: none;
    }
    .jack-label { position: absolute; transform: translateX(-50%); font: 500 8px "Jost", sans-serif; color: #ddd; white-space: nowrap; pointer-events: none; }
    .mounting-slot {
      position: absolute;
      width: 6mm;
      height: 3.2mm;
      border: 0.35mm solid #aaa;
      border-radius: 1.6mm;
      background: #000;
      transform: translate(-50%, -50%);
    }
    .mounting-slot.left { left: 7.5mm; }
    .mounting-slot.right { left: calc(100% - 7.5mm); }
    .mounting-slot.top { top: 3mm; }
    .mounting-slot.bottom { top: calc(100% - 3mm); }
  </style>
</head>
<body>
  <main class="panel" aria-label="PCS-100 48HP × 128.5mm panel">
    <!-- Diagram is informational, not a patchbay: solid arrows = normalled audio/phase flow; dashed = modulation. -->
    <svg class="diagram" viewBox="0 0 243.84 128.5" xmlns="http://www.w3.org/2000/svg" aria-label="VCC to PO to VCW to wavefolder to VCA signal flow">
      <defs>
        <marker id="arrow" viewBox="0 0 6 6" refX="5.2" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eee"/></marker>
        <marker id="mod-arrow" viewBox="0 0 6 6" refX="5.2" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#888"/></marker>
      </defs>
      <path class="flow" d="M 24 60 H 56 M 65 60 H 99 M 109 60 H 142 M 150 60 H 160 M 168 60 H 221" marker-end="url(#arrow)"/>
      <circle class="node" cx="24" cy="60" r="2.2"/><circle class="node" cx="65" cy="60" r="2.2"/>
      <circle class="node" cx="109" cy="60" r="2.2"/><circle class="node" cx="150" cy="60" r="2.2"/>
      <circle class="node" cx="168" cy="60" r="2.2"/>
      <text x="21" y="55">CLK</text><text x="58" y="55">φ</text><text x="99" y="55">WAVE</text><text x="141" y="55">FOLD</text><text x="162" y="55">AMP</text><text x="211" y="55">OUT</text>
      <path class="symbol" d="M 19 68 l4 -4 v8 l4 -4 M 60 68 q4 -7 8 0 M 103 69 l3 -6 l3 8 l3 -5"/>
      <path class="mod" d="M 191 67 V 63 H 168" marker-end="url(#mod-arrow)"/>
      <text x="178" y="70">EG → CV</text>
    </svg>
    <div class="module-block" style="left:13.97mm;width:35.56mm"><span>VCC</span></div>
    <div class="module-block" style="left:49.53mm;width:35.56mm"><span>PO</span></div>
    <div class="module-block" style="left:85.09mm;width:53.34mm"><span>VCW</span></div>
    <div class="module-block" style="left:138.43mm;width:17.78mm"><span>WF</span></div>
    <div class="module-block" style="left:156.21mm;width:17.78mm"><span>VCA</span></div>
    <div class="module-block" style="left:173.99mm;width:35.56mm"><span>EG</span></div>
    <div class="module-block" style="left:209.55mm;width:17.78mm"><span>UTIL</span></div>
    <div class="jack" style="left:22.86mm;top:28.69mm" aria-label="V/OCT"></div>
    <div class="jack-label" style="left:22.86mm;top:33.89mm">V/OCT</div>
    <div class="jack" style="left:40.64mm;top:28.69mm" aria-label="CLK IN"></div>
    <div class="jack-label" style="left:40.64mm;top:33.89mm">CLK IN</div>
    <div class="jack" style="left:22.86mm;top:46.47mm" aria-label="CLK OUT"></div>
    <div class="jack-label" style="left:22.86mm;top:51.67mm">CLK OUT</div>
    <div class="jack" style="left:40.64mm;top:46.47mm" aria-label="PH/PO"></div>
    <div class="jack-label" style="left:40.64mm;top:51.67mm">PH/PO</div>
    <div class="jack" style="left:58.42mm;top:28.69mm" aria-label="PH IN"></div>
    <div class="jack-label" style="left:58.42mm;top:33.89mm">PH IN</div>
    <div class="jack" style="left:76.20mm;top:28.69mm" aria-label="PO CV"></div>
    <div class="jack-label" style="left:76.20mm;top:33.89mm">PO CV</div>
    <div class="jack" style="left:58.42mm;top:46.47mm" aria-label="PO IN"></div>
    <div class="jack-label" style="left:58.42mm;top:51.67mm">PO IN</div>
    <div class="jack" style="left:76.20mm;top:46.47mm" aria-label="MOD"></div>
    <div class="jack-label" style="left:76.20mm;top:51.67mm">MOD</div>
    <div class="jack" style="left:93.98mm;top:28.69mm" aria-label="WIN CV"></div>
    <div class="jack-label" style="left:93.98mm;top:33.89mm">WIN CV</div>
    <div class="jack" style="left:111.76mm;top:28.69mm" aria-label="RES CV"></div>
    <div class="jack-label" style="left:111.76mm;top:33.89mm">RES CV</div>
    <div class="jack" style="left:129.54mm;top:28.69mm" aria-label="VCW OUT"></div>
    <div class="jack-label" style="left:129.54mm;top:33.89mm">VCW OUT</div>
    <div class="jack" style="left:93.98mm;top:46.47mm" aria-label="RAMP IN"></div>
    <div class="jack-label" style="left:93.98mm;top:51.67mm">RAMP IN</div>
    <div class="jack" style="left:147.32mm;top:28.69mm" aria-label="WF IN"></div>
    <div class="jack-label" style="left:147.32mm;top:33.89mm">WF IN</div>
    <div class="jack" style="left:147.32mm;top:46.47mm" aria-label="WF OUT"></div>
    <div class="jack-label" style="left:147.32mm;top:51.67mm">WF OUT</div>
    <div class="jack" style="left:165.10mm;top:28.69mm" aria-label="VCA IN"></div>
    <div class="jack-label" style="left:165.10mm;top:33.89mm">VCA IN</div>
    <div class="jack" style="left:165.10mm;top:46.47mm" aria-label="VCA OUT"></div>
    <div class="jack-label" style="left:165.10mm;top:51.67mm">VCA OUT</div>
    <div class="jack" style="left:182.88mm;top:28.69mm" aria-label="GATE"></div>
    <div class="jack-label" style="left:182.88mm;top:33.89mm">GATE</div>
    <div class="jack" style="left:200.66mm;top:28.69mm" aria-label="EG OUT"></div>
    <div class="jack-label" style="left:200.66mm;top:33.89mm">EG OUT</div>
    <div class="jack" style="left:182.88mm;top:46.47mm" aria-label="LFO OUT"></div>
    <div class="jack-label" style="left:182.88mm;top:51.67mm">LFO OUT</div>
    <div class="jack" style="left:200.66mm;top:46.47mm" aria-label="VCA CV"></div>
    <div class="jack-label" style="left:200.66mm;top:51.67mm">VCA CV</div>
    <div class="jack" style="left:218.44mm;top:28.69mm" aria-label="ATT IN"></div>
    <div class="jack-label" style="left:218.44mm;top:33.89mm">ATT IN</div>
    <div class="jack" style="left:218.44mm;top:46.47mm" aria-label="ATT OUT"></div>
    <div class="jack-label" style="left:218.44mm;top:51.67mm">ATT OUT</div>
    <div class="knob-small" style="left:22.86mm;top:76.20mm" aria-label="FREQ"></div>
    <div class="part-label" style="left:22.86mm;top:82.00mm">FREQ</div>
    <div class="toggle" style="left:40.64mm;top:93.98mm" aria-label="SYNC"></div>
    <div class="part-label" style="left:40.64mm;top:99.78mm">SYNC</div>
    <div class="knob-small" style="left:58.42mm;top:76.20mm" aria-label="AMOUNT"></div>
    <div class="part-label" style="left:58.42mm;top:82.00mm">AMOUNT</div>
    <div class="toggle" style="left:76.20mm;top:93.98mm" aria-label="MODE"></div>
    <div class="part-label" style="left:76.20mm;top:99.78mm">MODE</div>
    <div class="knob-large" style="left:111.76mm;top:93.98mm" aria-label="VCW large knob"></div>
    <div class="knob-small" style="left:93.98mm;top:76.20mm" aria-label="SHAPE"></div>
    <div class="part-label" style="left:93.98mm;top:82.00mm">SHAPE</div>
    <div class="knob-small" style="left:129.54mm;top:76.20mm" aria-label="WINDOW"></div>
    <div class="part-label" style="left:129.54mm;top:82.00mm">WINDOW</div>
    <div class="toggle" style="left:93.98mm;top:111.76mm" aria-label="MODE"></div>
    <div class="part-label" style="left:93.98mm;top:117.56mm">MODE</div>
    <div class="knob-small" style="left:147.32mm;top:93.98mm" aria-label="FOLD"></div>
    <div class="part-label" style="left:147.32mm;top:99.78mm">FOLD</div>
    <div class="knob-small" style="left:165.10mm;top:93.98mm" aria-label="LEVEL"></div>
    <div class="part-label" style="left:165.10mm;top:99.78mm">LEVEL</div>
    <div class="knob-small" style="left:182.88mm;top:76.20mm" aria-label="A"></div>
    <div class="part-label" style="left:182.88mm;top:82.00mm">A</div>
    <div class="knob-small" style="left:200.66mm;top:76.20mm" aria-label="D"></div>
    <div class="part-label" style="left:200.66mm;top:82.00mm">D</div>
    <div class="knob-small" style="left:182.88mm;top:111.76mm" aria-label="S"></div>
    <div class="part-label" style="left:182.88mm;top:117.56mm">S</div>
    <div class="knob-small" style="left:200.66mm;top:111.76mm" aria-label="R"></div>
    <div class="part-label" style="left:200.66mm;top:117.56mm">R</div>
    <div class="knob-small" style="left:218.44mm;top:76.20mm" aria-label="LFO"></div>
    <div class="part-label" style="left:218.44mm;top:82.00mm">LFO</div>
    <div class="knob-small" style="left:218.44mm;top:111.76mm" aria-label="ATT"></div>
    <div class="part-label" style="left:218.44mm;top:117.56mm">ATT</div>
    <div class="mounting-slot left top" aria-label="Top-left mounting slot"></div>
    <div class="mounting-slot right top" aria-label="Top-right mounting slot"></div>
    <div class="mounting-slot left bottom" aria-label="Bottom-left mounting slot"></div>
    <div class="mounting-slot right bottom" aria-label="Bottom-right mounting slot"></div>
  </main>
</body>
</html>
