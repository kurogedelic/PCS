<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCS-100</title>
  <style>
    :root { --grid: 17.78mm; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #000;
    }
    .panel {
      width: 152.4mm; /* 30HP × 5.08mm */
      height: 128.5mm;
      flex: none;
      box-shadow: inset 0 0 0 2px #454545;
      position: relative;
      background-color: #000;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.16) 1px, transparent 1px);
      background-size: var(--grid) var(--grid);
      /* Shift grid vertically down by 8.89mm from center alignment. */
      background-position:
        calc(50% + 8.89mm) calc(50% + 17.78mm);
    }
    .module-outline {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(50% - 53.34mm - 8.89mm);
      width: 17.78mm;
      border: 1mm solid #fff;
      pointer-events: none;
    }
    .jack {
      position: absolute;
      left: calc(50% - 53.34mm);
      top: calc(50% + 8.89mm + (var(--row) - 3) * 17.78mm);
      width: 8mm;
      height: 8mm;
      transform: translate(-50%, -50%);
      border: 1.2mm solid #9a9a9a;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 0 0.35mm #333, inset 0 0 0 0.7mm #333;
    }
  </style>
</head>
<body>
  <main class="panel" aria-label="PCS-100 30HP × 128.5mm panel">
    <div class="module-outline" aria-hidden="true"></div>
    <div class="jack" style="--row:0" aria-label="Jack 1"></div>
    <div class="jack" style="--row:1" aria-label="Jack 2"></div>
    <div class="jack" style="--row:2" aria-label="Jack 3"></div>
    <div class="jack" style="--row:3" aria-label="Jack 4"></div>
    <div class="jack" style="--row:4" aria-label="Jack 5"></div>
    <div class="jack" style="--row:5" aria-label="Jack 6"></div>
  </main>
</body>
</html>
