<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCS-100</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --grid: 17.78mm; }
    * { box-sizing: border-box; }
    .panel { font-family: "Jost", sans-serif; }
    html, body { margin: 0; min-width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #000;
    }
    .panel {
      width: 243.84mm; /* 48HP × 5.08mm */
      height: 128.5mm;
      flex: none;
      box-shadow: inset 0 0 0 2px #454545;
      position: relative;
      background-color: #000;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.16) 1px, transparent 1px);
      background-size: var(--grid) var(--grid);
      /* Keep the grid intersections aligned with the first module's jacks. */
      background-position: 22.86mm 19.8mm;
    }
    .module-outline {
      position: absolute;
      top: 8.89mm;
      bottom: 8.89mm;
      left: 13.97mm;
      width: 17.78mm;
      border: 0.5mm solid #fff;
      pointer-events: none;
    }
    .jack {
      position: absolute;
      left: 22.86mm;
      top: calc(19.8mm + var(--row) * 17.78mm);
      width: 8mm;
      height: 8mm;
      transform: translate(-50%, -50%);
      border: 1.2mm solid #9a9a9a;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 0 0.35mm #333, inset 0 0 0 0.7mm #333;
    }
    .mounting-slot {
      position: absolute;
      width: 6mm;
      height: 3.2mm;
      border: 0.35mm solid #aaa;
      border-radius: 1.6mm;
      background: #000;
      transform: translate(-50%, -50%);
    }
    .mounting-slot.left { left: 7.5mm; }
    .mounting-slot.right { left: calc(100% - 7.5mm); }
    .mounting-slot.top { top: 3mm; }
    .mounting-slot.bottom { top: calc(100% - 3mm); }
  </style>
</head>
<body>
  <main class="panel" aria-label="PCS-100 48HP × 128.5mm panel">
    <div class="module-outline" aria-hidden="true"></div>
    <div class="jack" style="--row:0" aria-label="Jack 1"></div>
    <div class="jack" style="--row:1" aria-label="Jack 2"></div>
    <div class="jack" style="--row:2" aria-label="Jack 3"></div>
    <div class="jack" style="--row:3" aria-label="Jack 4"></div>
    <div class="jack" style="--row:4" aria-label="Jack 5"></div>
    <div class="jack" style="--row:5" aria-label="Jack 6"></div>
    <div class="mounting-slot left top" aria-label="Top-left mounting slot"></div>
    <div class="mounting-slot right top" aria-label="Top-right mounting slot"></div>
    <div class="mounting-slot left bottom" aria-label="Bottom-left mounting slot"></div>
    <div class="mounting-slot right bottom" aria-label="Bottom-right mounting slot"></div>
  </main>
</body>
</html>
