<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCS-100</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --grid: 17.78mm; }
    * { box-sizing: border-box; }
    .panel { font-family: "Jost", sans-serif; }
    html, body { margin: 0; min-width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #000;
    }
    .panel {
      width: 243.84mm; /* 48HP × 5.08mm */
      height: 128.5mm;
      flex: none;
      box-shadow: inset 0 0 0 2px #454545;
      position: relative;
      background-color: #000;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.16) 1px, transparent 1px);
      background-size: var(--grid) var(--grid);
      /* Keep the grid intersections aligned with the first module's jacks. */
      background-position: 22.86mm 19.8mm;
    }
    .module-block { position:absolute; pointer-events:none; border-left: .25mm solid #505050; top:12mm; height:105mm; }
    .module-block span { position:absolute; top:-1mm; left:2mm; font-size:11px; font-weight:600; letter-spacing:.14em; color:#fff; }
    .diagram { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .diagram .flow { fill:none; stroke:#e0e0e0; stroke-width:.48; stroke-linejoin:round; }
    .diagram .mod { fill:none; stroke:#888; stroke-width:.32; stroke-dasharray:1.5 1.2; }
    .diagram .node { fill:#000; stroke:#eee; stroke-width:.45; }
    .diagram text { font-family:"Jost",sans-serif; font-size:2.8px; fill:#ccc; letter-spacing:.3px; }
    .diagram .symbol { stroke:#aaa; stroke-width:.38; fill:none; }
    .jack {
      position: absolute;
      width: 8mm;
      height: 8mm;
      transform: translate(-50%, -50%);
      border: 1.2mm solid #9a9a9a;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 0 0.35mm #333, inset 0 0 0 0.7mm #333;
    }
    /* Large knob centered on the grid; clearance must be checked against the physical part. */
    .knob-large {
      position: absolute;
      width: 25mm;
      height: 25mm;
      transform: translate(-50%, -50%);
      border: 2mm solid #383838;
      border-radius: 50%;
      background: #101010;
    }
    .knob-large::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 2mm;
      width: 1.2mm;
      height: 9mm;
      transform: translateX(-50%);
      background: #fff;
      border-radius: 0.3mm;
    }
    .knob-small, .toggle {
      position: absolute;
      transform: translate(-50%, -50%);
    }
    .knob-small {
      width: 9mm;
      height: 9mm;
      border-radius: 50%;
      background: #171717;
      border: 0.8mm solid #777;
    }
    .knob-small::after {
      content: "";
      position: absolute;
      top: 0.7mm;
      left: 50%;
      transform: translateX(-50%);
      width: 0.7mm;
      height: 2.8mm;
      background: white;
    }
    .toggle {
      width: 7mm;
      height: 7mm;
      border: 0.6mm solid #999;
      border-radius: 50%;
      background: #222;
    }
    .toggle::after {
      content: "";
      position: absolute;
      width: 1.4mm;
      height: 6mm;
      left: 50%;
      top: -2mm;
      transform: translateX(-50%);
      border-radius: 0.6mm;
      background: #ddd;
    }
    .part-label {
      position: absolute;
      transform: translateX(-50%);
      font: 500 8px "Jost", sans-serif;
      color: #ccc;
      letter-spacing: 0.04em;
      white-space: nowrap;
      pointer-events: none;
    }
    .jack-label { position: absolute; transform: translateX(-50%); font: 500 8px "Jost", sans-serif; color: #ddd; white-space: nowrap; pointer-events: none; }
    .panel-logo { position:absolute; left:50%; bottom:1.5mm; width:9mm; height:auto; transform:translateX(-50%); color:#ddd; }
    .mounting-slot {
      position: absolute;
      width: 6mm;
      height: 3.2mm;
      border: 0.35mm solid #aaa;
      border-radius: 1.6mm;
      background: #000;
      transform: translate(-50%, -50%);
    }
    .mounting-slot.left { left: 7.5mm; }
    .mounting-slot.right { left: calc(100% - 7.5mm); }
    .mounting-slot.top { top: 3mm; }
    .mounting-slot.bottom { top: calc(100% - 3mm); }
  </style>
</head>
<body>
  <main class="panel" aria-label="PCS-100 48HP × 128.5mm panel">
    <!-- Schematic-inspired graphics: arrows describe processing order, not verified jack normal connections. -->
    <svg class="diagram" viewBox="0 0 243.84 128.5" xmlns="http://www.w3.org/2000/svg" aria-label="Panel signal flow and control response diagrams">
      <defs><marker id="signal-arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto" viewBox="0 0 5 5"><path d="M0 0 L5 2.5 L0 5 Z" fill="#ddd"/></marker></defs>
      <!-- The flow is split at module boundaries, with no claims about unverified jack normals. -->
      <g fill="none" stroke="#ddd" stroke-width=".4">
        <path d="M17 59 H44" marker-end="url(#signal-arrow)"/>
        <path d="M53 59 H80" marker-end="url(#signal-arrow)"/>
        <path d="M89 59 H133" marker-end="url(#signal-arrow)"/>
        <path d="M142 59 H151" marker-end="url(#signal-arrow)"/>
        <path d="M160 59 H169" marker-end="url(#signal-arrow)"/>
      </g>
      <!-- Local symbols explain each transformation, not a second row of patch sockets. -->
      <g class="symbol">
        <path d="M19 65 H22 V62 H26 V65 H30 V62 H34 V65 H40"/>
        <path d="M55 65 L63 62 L69 66 L77 63"/>
        <path d="M91 65 H96 L99 62 L103 65 L107 62 L111 65 H119"/>
        <path d="M141 65 L144 62 L147 67 L150 64"/>
        <path d="M160 65 L164 63 L168 65"/>
      </g>
      <g font-size="2.6" fill="#ddd" font-family="Jost,sans-serif" text-anchor="middle">
        <text x="31" y="55">CLOCK / PHASE</text>
        <text x="67" y="55">PHASE OP</text>
        <text x="111" y="55">WINDOW</text>
        <text x="147" y="55">FOLD</text>
        <text x="165" y="55">AMP</text>
      </g>
      <!-- Envelope plot is physically between A/D and S/R controls. -->
      <path d="M178.8 98 L183.8 85 L189.2 94 L196 94 L205 100" fill="none" stroke="#ddd" stroke-width=".48"/>
      <path d="M178.8 100 H205" stroke="#555" stroke-width=".3"/>
      <g font-size="2.4" fill="#aaa" font-family="Jost,sans-serif">
        <text x="181" y="102.8">A</text><text x="186.8" y="89">D</text><text x="195" y="92">S</text><text x="203" y="97">R</text>
      </g>
      <!-- Small CV cue: utility modulation is distinct from the main phase/audio chain. -->
      <path d="M215 63 H224" stroke="#888" stroke-width=".35" stroke-dasharray="1.2 1" fill="none"/>
      <text x="219.5" y="59" text-anchor="middle">CV</text>
    </svg>
