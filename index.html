<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCS-100</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --grid: 17.78mm; }
    * { box-sizing: border-box; }
    .panel { font-family: "Jost", sans-serif; }
    html, body { margin: 0; min-width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #000;
    }
    .panel {
      width: 243.84mm; /* 48HP × 5.08mm */
      height: 128.5mm;
      flex: none;
      box-shadow: inset 0 0 0 2px #454545;
      position: relative;
      background-color: #000;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.16) 1px, transparent 1px);
      background-size: var(--grid) var(--grid);
      /* Keep the grid intersections aligned with the first module's jacks. */
      background-position: 22.86mm 19.8mm;
    }
    .module-outline {
      position: absolute;
      top: 10.91mm;
      bottom: 10.91mm;
      left: 13.97mm;
      width: 17.78mm;
      border: 0.5mm solid #fff;
      border-radius: 2mm;
      pointer-events: none;
    }
    .module-block {
      position: absolute;
      border: 0.5mm solid #fff;
      border-radius: 2mm;
      pointer-events: none;
    }
    .module-block span {
      position: absolute;
      top: 3mm;
      left: 3mm;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #fff;
    }
    .jack {
      position: absolute;
      left: 22.86mm;
      top: calc(19.8mm + var(--row) * 17.78mm);
      width: 8mm;
      height: 8mm;
      transform: translate(-50%, -50%);
      border: 1.2mm solid #9a9a9a;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 0 0.35mm #333, inset 0 0 0 0.7mm #333;
    }
    /* Large MXR-style knob: centered between grid intersections (2 × 2 cells). */
    .knob-large {
      position: absolute;
      left: 102.87mm;
      top: 46.47mm;
      width: 25mm;
      height: 25mm;
      transform: translate(-50%, -50%);
      border: 2mm solid #383838;
      border-radius: 50%;
      background: #101010;
    }
    .knob-large::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 2mm;
      width: 1.2mm;
      height: 9mm;
      transform: translateX(-50%);
      background: #fff;
      border-radius: 0.3mm;
    }
    .knob-small, .toggle {
      position: absolute;
      transform: translate(-50%, -50%);
    }
    .knob-small {
      width: 9mm;
      height: 9mm;
      border-radius: 50%;
      background: #171717;
      border: 0.8mm solid #777;
    }
    .knob-small::after {
      content: "";
      position: absolute;
      top: 0.7mm;
      left: 50%;
      transform: translateX(-50%);
      width: 0.7mm;
      height: 2.8mm;
      background: white;
    }
    .toggle {
      width: 7mm;
      height: 7mm;
      border: 0.6mm solid #999;
      border-radius: 50%;
      background: #222;
    }
    .toggle::after {
      content: "";
      position: absolute;
      width: 1.4mm;
      height: 6mm;
      left: 50%;
      top: -2mm;
      transform: translateX(-50%);
      border-radius: 0.6mm;
      background: #ddd;
    }
    .part-label {
      position: absolute;
      transform: translateX(-50%);
      font: 500 8px "Jost", sans-serif;
      color: #ccc;
      letter-spacing: 0.04em;
      white-space: nowrap;
      pointer-events: none;
    }
    .mounting-slot {
      position: absolute;
      width: 6mm;
      height: 3.2mm;
      border: 0.35mm solid #aaa;
      border-radius: 1.6mm;
      background: #000;
      transform: translate(-50%, -50%);
    }
    .mounting-slot.left { left: 7.5mm; }
    .mounting-slot.right { left: calc(100% - 7.5mm); }
    .mounting-slot.top { top: 3mm; }
    .mounting-slot.bottom { top: calc(100% - 3mm); }
  </style>
</head>
<body>
  <main class="panel" aria-label="PCS-100 48HP × 128.5mm panel">
    <div class="module-outline" aria-hidden="true"></div>
    <div class="jack" style="--row:0" aria-label="Jack 1"></div>
    <div class="jack" style="--row:1" aria-label="Jack 2"></div>
    <div class="jack" style="--row:2" aria-label="Jack 3"></div>
    <div class="jack" style="--row:3" aria-label="Jack 4"></div>
    <div class="jack" style="--row:4" aria-label="Jack 5"></div>
    <div class="jack" style="--row:5" aria-label="Jack 6"></div>
    <!-- Rough module zoning, snapped to the 8.89mm subgrid. -->
    <div class="module-block" style="left:40.64mm;top:10.91mm;width:35.56mm;height:53.34mm"><span>VCC</span></div>
    <div class="module-block" style="left:40.64mm;top:64.25mm;width:35.56mm;height:53.34mm"><span>PO</span></div>
    <div class="module-block" style="left:85.09mm;top:10.91mm;width:44.45mm;height:106.68mm"><span>VCW</span></div>
    <div class="module-block" style="left:138.43mm;top:10.91mm;width:35.56mm;height:53.34mm"><span>WF</span></div>
    <div class="module-block" style="left:138.43mm;top:64.25mm;width:35.56mm;height:53.34mm"><span>VCA</span></div>
    <div class="module-block" style="left:182.88mm;top:10.91mm;width:26.67mm;height:53.34mm"><span>EG</span></div>
    <div class="module-block" style="left:182.88mm;top:64.25mm;width:26.67mm;height:53.34mm"><span>LFO</span></div>
    <div class="module-block" style="left:218.44mm;top:10.91mm;width:17.78mm;height:53.34mm"><span>ATT</span></div>
    <div class="module-block" style="left:218.44mm;top:64.25mm;width:17.78mm;height:53.34mm"><span>MINI VCA</span></div>
    <div class="knob-large" aria-label="Large MXR-style knob"></div>
    <div class="knob-small" style="left:49.53mm;top:35.5mm" aria-label="FREQ"></div>
    <div class="part-label" style="left:49.53mm;top:41.5mm">FREQ</div>
    <div class="toggle" style="left:67.31mm;top:35.5mm" aria-label="SYNC"></div>
    <div class="part-label" style="left:67.31mm;top:41.5mm">SYNC</div>
    <div class="knob-small" style="left:49.53mm;top:88mm" aria-label="AMOUNT"></div>
    <div class="part-label" style="left:49.53mm;top:94mm">AMOUNT</div>
    <div class="toggle" style="left:67.31mm;top:88mm" aria-label="MODE"></div>
    <div class="part-label" style="left:67.31mm;top:94mm">MODE</div>
    <div class="knob-small" style="left:120.65mm;top:46.47mm" aria-label="SHAPE"></div>
    <div class="part-label" style="left:120.65mm;top:52.47mm">SHAPE</div>
    <div class="knob-small" style="left:102.87mm;top:82.03mm" aria-label="WINDOW"></div>
    <div class="part-label" style="left:102.87mm;top:88.03mm">WINDOW</div>
    <div class="knob-small" style="left:120.65mm;top:82.03mm" aria-label="RES"></div>
    <div class="part-label" style="left:120.65mm;top:88.03mm">RES</div>
    <div class="toggle" style="left:111.76mm;top:103mm" aria-label="MODE"></div>
    <div class="part-label" style="left:111.76mm;top:109mm">MODE</div>
    <div class="knob-small" style="left:156.21mm;top:35.5mm" aria-label="FOLD"></div>
    <div class="part-label" style="left:156.21mm;top:41.5mm">FOLD</div>
    <div class="knob-small" style="left:156.21mm;top:88mm" aria-label="LEVEL"></div>
    <div class="part-label" style="left:156.21mm;top:94mm">LEVEL</div>
    <div class="knob-small" style="left:191.77mm;top:25mm" aria-label="A"></div>
    <div class="part-label" style="left:191.77mm;top:31mm">A</div>
    <div class="knob-small" style="left:200.66mm;top:36mm" aria-label="D"></div>
    <div class="part-label" style="left:200.66mm;top:42mm">D</div>
    <div class="knob-small" style="left:191.77mm;top:47mm" aria-label="S"></div>
    <div class="part-label" style="left:191.77mm;top:53mm">S</div>
    <div class="knob-small" style="left:200.66mm;top:57mm" aria-label="R"></div>
    <div class="part-label" style="left:200.66mm;top:63mm">R</div>
    <div class="knob-small" style="left:196.215mm;top:88mm" aria-label="RATE"></div>
    <div class="part-label" style="left:196.215mm;top:94mm">RATE</div>
    <div class="toggle" style="left:196.215mm;top:106mm" aria-label="WAVE"></div>
    <div class="part-label" style="left:196.215mm;top:112mm">WAVE</div>
    <div class="knob-small" style="left:227.33mm;top:35.5mm" aria-label="ATT"></div>
    <div class="part-label" style="left:227.33mm;top:41.5mm">ATT</div>
    <div class="knob-small" style="left:227.33mm;top:83mm" aria-label="VCA1"></div>
    <div class="part-label" style="left:227.33mm;top:89mm">VCA1</div>
    <div class="knob-small" style="left:227.33mm;top:105mm" aria-label="VCA2"></div>
    <div class="part-label" style="left:227.33mm;top:111mm">VCA2</div>
    <div class="mounting-slot left top" aria-label="Top-left mounting slot"></div>
    <div class="mounting-slot right top" aria-label="Top-right mounting slot"></div>
    <div class="mounting-slot left bottom" aria-label="Bottom-left mounting slot"></div>
    <div class="mounting-slot right bottom" aria-label="Bottom-right mounting slot"></div>
  </main>
</body>
</html>
