<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCS-100</title>
  <style>
    :root { --grid: 17.78mm; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #000;
    }
    .panel {
      width: 152.4mm; /* 30HP × 5.08mm */
      height: 128.5mm;
      flex: none;
      border: 2px solid #454545;
      background-color: #000;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.16) 1px, transparent 1px);
      background-size: var(--grid) var(--grid);
      /* Shift grid vertically down by 8.89mm from center alignment. */
      background-position:
        calc(50% + 8.89mm) calc(50% + 17.78mm);
    }
  </style>
</head>
<body>
  <main class="panel" aria-label="PCS-100 30HP × 128.5mm panel"></main>
</body>
</html>
